# Marksman LSP — project-level config
# =====================================
# Marksman hanya membaca settings dari file ini (.marksman.toml) atau user
# config (~/.config/marksman/config.toml) — bukan dari nvim-lspconfig.
# Precedence: project > user > default.
# Default lengkap: https://raw.githubusercontent.com/artempyanykh/marksman/main/Tests/default.marksman.toml
#
# File ini juga jadi "project root marker": tanpa ini atau .git, Marksman
# jalan di single-file mode (cross-file refs tidak aktif).
#
# Konteks repo ini (MarkCache, lihat docs/adr/002):
# - Konvensi folder-note: satu kategori = satu folder + index.md
#   (content/streaming/index.md -> /streaming).
# - Wikilink [[...]] DILARANG di v1 (ADR-002) — pakai relative markdown link
#   ([Label](../kategori/)) yang jalan di Obsidian maupun Nuxt Content.
# - Akibatnya fitur wiki-centric di bawah (completion/wiki-style,
#   create_missing_file) mostly dormant; nilai Marksman di sini = root marker
#   + diagnostik md-link + TOC code action.
# - Bila wikilink dibuka di v2, tinjau ulang title_from_heading + wiki.style:
#   dengan folder-note, file-stem selalu "index" sehingga tak berguna;
#   title-slug lebih tepat.

[core]
# Ekstensi markdown yang di-scan
markdown.file_extensions = ["md", "markdown"]
# H1 dianggap judul dokumen (true = wiki completion pakai title-slug).
# false di sini disengaja: melengkapi wiki.style = "file-stem" di bawah
# (upstream: false otomatis mengubah default completion ke file-based).
title_from_heading = false
# Sync protocol: "full" lebih stabil (incremental ada bug di beberapa editor)
text_sync = "full"
# Experimental incremental refs — biarkan false untuk stabilitas
incremental_references = false

[code_action]
# Table of Contents code action (muncul di Neovim via `vim.lsp.buf.code_action`)
toc.enable = true
# Heading yang masuk TOC
toc.include = [1, 2, 3, 4, 5, 6]
# Bikin file kosong kalau link ke file yang belum ada.
# Komplemen: scripts/contentlint.mjs me-warning bila target link tak ada.
create_missing_file.enable = true

[completion]
# Max kandidat completion
candidates = 50
# Gaya wiki link: "file-stem" = [[streaming]] -> streaming.md.
# Dormant di v1 (wikilink dilarang ADR-002); lihat catatan di atas soal v2.
wiki.style = "file-stem"
